<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Catecumen</title>
  <link rel="icon" href="/cat.ico" />
  <!-- Respaldo si el JS no corre: siempre va al sitio principal -->
  <noscript><meta http-equiv="refresh" content="0;url=https://www.catecumen.com" /></noscript>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#0A1430;color:#EAD08A;
      font-family:-apple-system,'Segoe UI',Roboto,system-ui,Arial,sans-serif}
    .box{text-align:center}
    .box img{width:76px;height:76px;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
    .box p{margin:16px 0 0;font-size:15px;letter-spacing:.03em;opacity:.9}
    .sp{margin:14px auto 0;width:26px;height:26px;border:3px solid rgba(200,169,81,.3);
      border-top-color:#C8A951;border-radius:50%;animation:g .8s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <img src="/icon-192.png" alt="Catecumen" />
    <div class="sp"></div>
    <p>Redirigiendo…</p>
  </div>
  <script type="module">
    const SUPA_URL = "https://jqlfjfamraavsbhdusuq.supabase.co";
    const ANON = import.meta.env.VITE_SUPABASE_ANON_KEY;
    const FALLBACK = "https://www.catecumen.com";
    const slug = ((new URLSearchParams(location.search).get("c")) || "home").toLowerCase().trim();
    let done = false;
    const go = (u) => { if (done) return; done = true; location.replace(u || FALLBACK); };
    // Respaldo por tiempo: si la red tarda, no dejamos al usuario esperando.
    setTimeout(() => go(FALLBACK), 2500);
    (async () => {
      try {
        const r = await fetch(SUPA_URL + "/rest/v1/rpc/qr_hit", {
          method: "POST",
          headers: { apikey: ANON, Authorization: "Bearer " + ANON, "Content-Type": "application/json" },
          body: JSON.stringify({
            p_slug: slug,
            p_ua: navigator.userAgent || null,
            p_ref: document.referrer || null,
            p_lang: navigator.language || null,
          }),
        });
        const d = await r.json();
        go(typeof d === "string" && d ? d : FALLBACK);
      } catch (e) { go(FALLBACK); }
    })();
  </script>
</body>
</html>
