<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Catecumen — Acceso</title>
<link rel="icon" href="/cat.ico"/>
<style>
  :root{--navy:#0c1829;--gold:#C8A951;--ivory:#F0EAD6}
  html,body{margin:0;height:100%}
  body{background:var(--navy);color:var(--ivory);font-family:Georgia,'Times New Roman',serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{text-align:center;max-width:460px;padding:40px 28px}
  .logo{font-size:30px;letter-spacing:5px;color:var(--gold);font-weight:700;margin-bottom:6px}
  .sub{font-size:13px;color:#cdbf98;margin-bottom:28px}
  .spin{width:46px;height:46px;border:4px solid rgba(200,169,81,.25);border-top-color:var(--gold);
    border-radius:50%;margin:0 auto 20px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .msg{font-size:15px;line-height:1.5}
  .err{display:none;font-size:14px;color:#f2c94c;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">CATECUMEN</div>
    <div class="sub">Centro Internacional de Catequesis a Distancia</div>
    <div class="spin" id="spin"></div>
    <div class="msg" id="msg">Preparando tu acceso seguro…</div>
    <div class="err" id="err">Este enlace no es válido o ya se usó. Solicita uno nuevo al administrador.</div>
  </div>
<script>
  var SUPA = "https://jqlfjfamraavsbhdusuq.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxbGZqZmFtcmFhdnNiaGR1c3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDEwNjIsImV4cCI6MjA5Njc3NzA2Mn0.AFD2j0ERaNqx4gii8z3sOvdbkIJl3Kzs_qyDErm7SL8";
  var ESVERIFY = /^https:\/\/[a-z0-9.\-]+\.supabase\.co\/auth\/v1\/verify/i;
  function fail(msg){
    document.getElementById("spin").style.display = "none";
    document.getElementById("msg").style.display = "none";
    var e = document.getElementById("err");
    if(msg) e.textContent = msg + " Solicita uno nuevo al administrador.";
    e.style.display = "block";
  }
  (function(){
    try{
      var q = new URLSearchParams(location.search);
      // Enlace de revisor con token propio: se canjea en el servidor (uno por enlace,
      // revocable) por un enlace de verificación de Supabase generado al momento.
      var rt = q.get("rt");
      if(rt){
        fetch(SUPA + "/functions/v1/revisor-canjear", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": ANON },
          body: JSON.stringify({ token: rt })
        }).then(function(r){ return r.json(); })
          .then(function(o){
            if(o && o.enlace && ESVERIFY.test(o.enlace)){ location.replace(o.enlace); }
            else { fail(o && o.error ? o.error : ""); }
          }).catch(function(){ fail(); });
        return;
      }
      // Compatibilidad: enlace de Supabase embebido en el hash (o ?u=).
      var h = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
      if(!h){ h = q.get("u") || ""; }
      if(h && ESVERIFY.test(h)){ location.replace(h); return; }
    }catch(e){}
    fail();
  })();
</script>
</body>
</html>
