    <!-- Fondo de pantalla completa = elemento LCP de la app.
         Va ESTÁTICO (no creado por JS) para que el escáner de precarga del
         navegador lo encuentre antes de ejecutar ningún script, y con
         fetchpriority alto, tal como recomienda la auditoría de Lighthouse.
         Se precarga el tema claro, que es el predeterminado; si el usuario
         tiene el oscuro, el script de más abajo añade el suyo. -->
    <link rel="preload" as="image" href="/fondocatecumen-claro.webp" fetchpriority="high" />

    <!-- Fuentes (Cinzel + Crimson Text). Iban dentro del bundle vía @import,
         así que el navegador no las pedía hasta descargar 235 KB de JS
         (eran el eslabón más lento: 651 ms de latencia de ruta crítica).
         Aquí se descubren de inmediato; preconnect adelanta la conexión TLS a
         los dos servidores de Google, y display=swap evita texto invisible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"

    <title>Catecumen: El Aula Global de la Catequesis</title>
    <script>
      // Título del tab localizado: usa el idioma guardado por la app
      // (localStorage "catecumen_lang") o, si no hay, el del navegador.
      // Se ejecuta antes de React para que la pestaña muestre el idioma correcto
      // de inmediato; al cambiar de idioma la app recarga y este script re-corre.
      (function () {
        try {
          var L = ["es", "en", "fr", "de", "pt", "it"];
          var s = localStorage.getItem("catecumen_lang");
          var lang = (s && L.indexOf(s) > -1)
            ? s
            : (navigator.language || "es").toLowerCase().split("-")[0];
          if (L.indexOf(lang) < 0) lang = "es";
          var titles = {
            es: "Catecumen: El Aula Global de la Catequesis",
            en: "Catecumen: The Global Classroom of Catechesis",
            fr: "Catecumen : La Salle de Classe Mondiale de la Catéchèse",
            de: "Catecumen: Das globale Klassenzimmer der Katechese",
            pt: "Catecumen: A Sala de Aula Global da Catequese",
            it: "Catecumen: L'Aula Globale della Catechesi"
          };
          document.title = titles[lang] || titles.es;
        } catch (e) {}

        // El tema claro ya va precargado estáticamente arriba (y es el fondo del
        // splash = elemento LCP). Solo si el usuario tiene el tema oscuro guardado,
        // precargamos su fondo Y sobreescribimos el del splash con un <style>
        // inyectado ANTES de que el body pinte (evita un flash de fondo claro).
        try {
          if (localStorage.getItem("catecumen_theme") === "dark") {
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "image";
            l.href = "/fondocatecumen.webp";
            l.setAttribute("fetchpriority", "high");
            document.head.appendChild(l);
            var st = document.createElement("style");
            st.textContent = "#cat-splash{background-image:url(/fondocatecumen.webp)!important}";
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <!-- Pantalla de carga: HTML/CSS puro, sin peticiones externas. Pinta de
           inmediato (mejora el First Contentful Paint) y React la reemplaza
           automáticamente al montar. -->
      <!-- El fondo de pantalla completa (fondocatecumen-claro.webp, precargado
           arriba con fetchpriority=high) va AQUÍ, en HTML estático, para que sea
           el elemento LCP y pinte a la velocidad del FCP en vez de esperar a que
           React monte. React reemplaza este splash al terminar de cargar. El
           tema oscuro lo ajusta el script inline del <head> (inyecta un <style>).
           El contenido va sobre una tarjeta translúcida para mantener contraste. -->
      <div id="cat-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:22px;z-index:9999;
        background:#0B1526 center/cover no-repeat;background-image:url(/fondocatecumen-claro.webp)">
        <style>
          @keyframes catPulse{0%,100%{opacity:.75;transform:scale(.98)}50%{opacity:1;transform:scale(1)}}
          @keyframes catBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
        </style>
        <div style="display:flex;flex-direction:column;align-items:center;gap:22px;
          padding:36px 48px;border-radius:24px;background:rgba(11,21,38,.55);
          -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)">
        <svg width="118" height="118" viewBox="0 0 100 100" aria-label="Catecumen"
             style="animation:catPulse 1.8s ease-in-out infinite">
          <defs>
            <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#F0D68A"/><stop offset="100%" stop-color="#B08A2F"/>
            </linearGradient>
          </defs>
          <rect x="46.6" y="8" width="6.8" height="27" fill="url(#cg)"/>
          <rect x="38.5" y="16.4" width="23" height="6.8" fill="url(#cg)"/>
          <text x="50" y="88" text-anchor="middle" fill="url(#cg)"
                font-family="Georgia,'Times New Roman',serif" font-size="72" font-weight="700">C</text>
        </svg>
        <div style="font-family:Georgia,'Times New Roman',serif;color:#F0D68A;font-size:15px;
          letter-spacing:.34em;text-transform:uppercase">Catecumen</div>
        <div style="width:132px;height:2px;background:rgba(200,169,81,.25);overflow:hidden;border-radius:2px">
          <div style="width:40%;height:100%;background:#F0D68A;animation:catBar 1.4s ease-in-out infinite"></div>
        </div>
        </div>
        <noscript>
          <p style="color:#F0EAD6;font-family:system-ui,sans-serif;font-size:14px;text-align:center;max-width:300px">
            Esta plataforma necesita JavaScript activado para funcionar.
          </p>
        </noscript>
      </div>

      <div style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">
        <main style="font-family:system-ui,sans-serif;color:#0f172a">
          <h1 style="color:#1e3a8a">Catecumen</h1>
          <p>Centro Internacional de Catequesis a Distancia.</p>
          <p>
