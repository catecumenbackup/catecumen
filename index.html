    <script>
      // Título del tab localizado: usa el idioma guardado por la app
      // (localStorage "catecumen_lang") o, si no hay, el del navegador.
      // Se ejecuta antes de React para que la pestaña muestre el idioma correcto
      // de inmediato; al cambiar de idioma la app recarga y este script re-corre.
      (function () {
        try {
          var L = ["es", "en", "fr", "de", "pt", "it"];
          var s = localStorage.getItem("catecumen_lang");
          var lang = (s && L.indexOf(s) > -1)
            ? s
            : (navigator.language || "es").toLowerCase().split("-")[0];
          if (L.indexOf(lang) < 0) lang = "es";
          var titles = {
            es: "Catecumen: El Aula Global de la Catequesis",
            en: "Catecumen: The Global Classroom of Catechesis",
            fr: "Catecumen : La Salle de Classe Mondiale de la Catéchèse",
            de: "Catecumen: Das globale Klassenzimmer der Katechese",
            pt: "Catecumen: A Sala de Aula Global da Catequese",
            it: "Catecumen: L'Aula Globale della Catechesi"
          };
          document.title = titles[lang] || titles.es;
        } catch (e) {}
      })();
    </script>
